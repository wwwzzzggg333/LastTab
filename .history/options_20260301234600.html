<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LastTab 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon128.png" alt="LastTab" class="header-icon">
      <h1>LastTab 设置</h1>
      <p>配置标签页切换快捷键</p>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="icon">⌨️</span>
        自定义快捷键
      </div>

      <div class="shortcut-row">
        <div>
          <div class="shortcut-label">后退（上一个标签页）</div>
          <div class="shortcut-desc">回到上一次访问的标签页</div>
        </div>
        <div class="shortcut-input" id="shortcut-back" tabindex="0">Alt + Z</div>
      </div>

      <div class="shortcut-row">
        <div>
          <div class="shortcut-label">前进（下一个标签页）</div>
          <div class="shortcut-desc">前往后退之前的标签页</div>
        </div>
        <div class="shortcut-input" id="shortcut-forward" tabindex="0">Alt + X</div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btn-save">保存设置</button>
        <button class="btn btn-secondary" id="btn-reset">恢复默认</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span class="icon">💡</span>
        提示
      </div>
      <div class="note">
        上方自定义快捷键在普通网页中生效。如需在 Chrome 内部页面（如新标签页、设置页）中也能使用，
        请设置 Chrome 原生快捷键作为补充：
        <br>
        <button class="chrome-shortcut-btn" id="btn-chrome-shortcuts">
          打开 Chrome 快捷键设置
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="options.js"></script>
</body>
</html>
